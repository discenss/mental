  code: TEXT_ANX_W3_T3
  days: 5-6
  title: Без лишней страховки
  text: |
    Эта практика объединяет задания пятого и шестого дней. Вы уже заметили избегание и попробовали небольшие действия. Теперь посмотрим на более тонкий механизм: защитное поведение.
    Иногда человек входит в тревожную ситуацию, но делает это только при условии множества дополнительных «страховок». Он многократно перепроверяет уже проверенное, постоянно спрашивает подтверждение, чрезмерно готовится, держит рядом человека «на всякий случай», заранее продумывает пути отхода или непрерывно контролирует своё состояние.
    Важно различать защитное поведение и разумную безопасность. Мы не предлагаем игнорировать реальные риски, медицинские рекомендации, правила дорожного движения, требования работы или другие необходимые меры. Нас интересуют действия, главная функция которых — получить дополнительную эмоциональную гарантию там, где объективной необходимости в ней нет.
    Выберите одну такую ситуацию из задания дня.
    В какой ситуации я особенно стараюсь подстраховаться из-за тревоги?
    Что именно я делаю дополнительно?
    Теперь попробуйте понять функцию этого поведения. Не спрашивайте пока, хорошо оно или плохо. Спросите, чего вы пытаетесь добиться.
    Часто ответ связан с уверенностью: «хочу точно знать, что всё будет хорошо», «хочу исключить ошибку», «хочу быть уверен, что тревога не усилится». Но стопроцентная уверенность редко достижима. Поэтому одна проверка рождает потребность во второй, одно подтверждение — в следующем.
    Посмотрите на свою подстраховку именно с этой точки зрения.
    Какую гарантию я пытаюсь получить?
    Сколько времени эта гарантия действительно меня успокаивает?
    Возникает ли потом желание проверить или уточнить снова?
    Теперь выберите очень небольшое изменение. Мы не убираем всё защитное поведение сразу. Если вы обычно проверяете несколько раз — попробуйте сократить одну лишнюю проверку. Если всегда просите дополнительное подтверждение — попробуйте один раз остановиться до него. Если готовитесь намного дольше необходимого — заранее определите разумный момент завершения подготовки.
    Это небольшой поведенческий эксперимент, а не испытание силы воли.
    Какую одну лишнюю страховку я могу сегодня уменьшить совсем немного?
    Что я ожидаю почувствовать, если сделаю это?
    Чего, по прогнозу тревоги, я рискую лишиться без этой страховки?
    Перед действием зафиксируйте прогноз. Затем выполните выбранное действие с немного меньшей подстраховкой.
    Возможно, тревога временно усилится. Это не означает, что эксперимент не работает. Раньше привычная страховка быстро снижала напряжение, и мозг привык получать это облегчение. Сейчас вы даёте ему возможность узнать другое: неопределённость можно выдерживать без бесконечного контроля.
    Не пытайтесь специально подавлять тревогу. Продолжайте обычное действие настолько, насколько это безопасно и посильно.
    После эксперимента вернитесь к фактам.
    Что, по моему прогнозу, должно было произойти?
    Что произошло в реальности?
    Если возникло неприятное состояние, смог ли я его выдержать без прежнего объёма подстраховки?
    Появилась ли необходимость срочно возвращаться к привычной проверке или она постепенно уменьшилась?
    Теперь свяжите этот опыт со всей неделей. Вспомните хотя бы один момент, когда вы сделали то, что раньше скорее отложили бы или избежали. Не ищите впечатляющий результат. Маленькие изменения здесь важнее.
    Новый опыт не обязательно звучит как «теперь я ничего не боюсь». Более точные выводы могут быть другими: «я тревожился, но сделал»; «не был уверен, но справился»; «мне хотелось перепроверить, но я остановился»; «тревога усилилась, а потом изменилась сама»; «я могу выдержать больше неопределённости, чем предполагал».
    Какой маленький шаг этой недели оказался для меня самым важным?
    Что я ожидал до него?
    Что произошло во время и после?
    Что я теперь знаю из собственного опыта, а не только предполагаю?
    Это и есть материал, который важно закрепить. Тревога может продолжать появляться, но у вас постепенно возникает альтернатива автоматическому избеганию и подстраховке. Между тревогой и действием появляется пространство для выбора.
    На следующий день вы можете повторить эксперимент с той же ситуацией или выбрать похожую. Не увеличивайте сложность только ради прогресса. Повторение посильного действия часто полезнее резкого усложнения.
    В завершение сохраните в дневнике три наблюдения. Их можно написать или надиктовать голосом.
    Моя привычная лишняя страховка — это…
    Сегодня я уменьшил её следующим образом…
    Новый опыт, который я хочу сохранить после этой недели…
- week: 4
  slot: T1
  code: TEXT_ANX_W4_T1
  days: 1-2
  title: Мысль, факт и прогноз
  text: |
    Эта практика связана с заданиями первых двух дней недели. Сегодня мы начинаем разбираться, как тревожные мысли отличаются от фактов и прогнозов.
    Тревога очень часто говорит голосом уверенности. Мысль «что-то обязательно пойдёт не так» ощущается почти как установленный факт, а не как одно из возможных предположений. Именно поэтому важно научиться на мгновение останавливаться и спрашивать: это действительно факт — или это прогноз, который ещё не проверен?
    Вспомните одну недавнюю тревожную мысль. Не самую драматичную, а обычную, повседневную: мысль о разговоре, о работе, о здоровье, об отношениях, о будущем событии.
    Запишите её так, как она прозвучала у вас в голове.
    Теперь задайте себе вопрос: что из этого является фактом, который можно подтвердить прямо сейчас объективными данными? А что является прогнозом — предположением о том, что может произойти?
    Факт — это то, что уже случилось или происходит сейчас и может быть подтверждено наблюдением: «мне не ответили на сообщение в течение часа». Прогноз — это предположение о будущем: «значит, случилось что-то плохое» или «значит, он на меня обиделся».
    Разделите свою мысль на эти две части.
    Что я точно знаю как факт?
    Что является моим прогнозом или интерпретацией?
    Обратите внимание, что тревога часто объединяет факт и прогноз в одно предложение, и тогда это предложение воспринимается целиком как истина. Задача этой практики — разъединить их.
    Теперь посмотрите на свой прогноз внимательнее. Насколько он единственно возможный?
    Можете ли вы представить хотя бы одно другое объяснение того же факта?
    Например, если факт — «мне не ответили», возможные объяснения могут быть разными: человек занят, у него разрядился телефон, он ещё не видел сообщение, он обдумывает ответ, а не обязательно случилось что-то плохое.
    Не нужно выбирать самое позитивное объяснение и заставлять себя в него поверить. Сейчас достаточно увидеть, что существует больше одного варианта.
    Запишите два-три альтернативных объяснения того же факта.
    Теперь вернитесь к своему изначальному прогнозу и спросите: насколько сильно я ему верю, если оценивать от 0 до 100?
    А затем, после того как вы увидели другие варианты: изменилась ли эта уверенность хоть немного?
    Не обязательно, чтобы цифра резко упала. Иногда достаточно, что она сдвигается хотя бы на несколько пунктов. Это уже признак того, что мышление стало немного более гибким.
    В завершение сформулируйте короткое наблюдение: моя тревожная мысль сегодня была… Факт в её основе был… Мой прогноз был… Другое возможное объяснение того же факта…
    Сохраните это в дневнике. Это небольшое наблюдение постепенно формирует новую привычку: не принимать тревожный прогноз автоматически за установленный факт.
- week: 4
  slot: T2
  code: TEXT_ANX_W4_T2
  days: 3-4
  title: Проверка катастрофического сценария
  text: |
    Эта практика продолжает работу третьего и четвёртого дней и посвящена катастрофизации — привычке мышления сразу перескакивать к самому худшему возможному исходу.
    Катастрофизация работает очень быстро. Небольшой тревожный сигнал почти мгновенно разворачивается в целую цепочку: если это произойдёт, то случится ещё худшее, а потом станет совсем невыносимо. Эта цепочка редко проверяется — она просто ощущается как неизбежность.
    Вспомните ситуацию, в которой вы заметили катастрофический сценарий. Опишите его так, как он прозвучал у вас внутри, шаг за шагом: сначала произойдёт это, потом это, а закончится вот так.
    Теперь возьмите первое звено этой цепочки — самое первое событие, с которого всё начинается.
    Насколько вероятно, что именно это первое событие вообще произойдёт? Если оценивать реалистично, а не через тревогу, какова вероятность от 0 до 100?
    Какие есть доказательства за то, что это произойдёт?
    Какие есть доказательства против, или что обычно происходило в похожих ситуациях раньше?
    Теперь посмотрите на следующее звено цепочки, при условии, что первое всё же случилось. Насколько автоматически из первого события следует второе? Есть ли примеры, когда первое происходило, а второе — нет?
    Продолжите эту проверку по всей цепочке, насколько получится. Вы, скорее всего, заметите, что вероятность всей цепочки целиком гораздо ниже, чем ощущение неизбежности, которое создаёт тревога. Каждое отдельное звено может быть возможным, но их последовательное совпадение — куда менее вероятно.
    Теперь спросите себя о другом: даже если бы худший вариант действительно случился, что бы я тогда сделал? Есть ли у меня хоть какие-то ресурсы, люди, действия, которые помогли бы справиться?
    Это не способ доказать, что всё будет хорошо. Это способ проверить, насколько реалистична сама катастрофическая цепочка, и напомнить себе, что даже сложная ситуация обычно не означает полную беспомощность.
    Запишите главный вывод: моя катастрофическая мысль была… При ближайшей проверке я обнаружил, что… Даже если бы часть этого случилась, я мог бы…
    Сохраните эту запись. Это упражнение полезно повторять с разными тревожными сценариями — со временем проверка доказательств становится более быстрой и естественной.
- week: 4
  slot: T3
  code: TEXT_ANX_W4_T3
  days: 5-6
  title: От тревожной мысли к действию
  text: |
    Эта практика завершает неделю, посвящённую тревожным мыслям, и связана с заданиями пятого и шестого дней.
    Мы уже учились различать факт и прогноз, а также проверять катастрофические сценарии через доказательства. Сегодня добавим последний шаг: переход от тревожной мысли к действию.
    Вспомните одну тревожную мысль, которая у вас часто повторяется. Запишите её.
    Теперь задайте несколько вопросов, которые помогают посмотреть на эту мысль со стороны.
    Насколько эта мысль помогает мне действовать, а насколько только усиливает тревогу?
    Если бы я посмотрел на эту ситуацию через год, насколько важной она будет казаться?
    Что бы я сказал близкому человеку, если бы он поделился со мной такой же мыслью?
    Эти вопросы не отменяют саму тревогу, но помогают немного отстраниться от автоматического потока мыслей и увидеть ситуацию объёмнее.
    Теперь попробуйте сформулировать альтернативную, более сбалансированную мысль — не искусственно позитивную, а реалистичную, учитывающую и факты, и возможность других объяснений, и ограниченность катастрофического прогноза.
    Запишите её рядом с первоначальной тревожной мыслью.
    Сравните две формулировки. Какая из них точнее описывает реальную ситуацию, если учитывать все собранные на этой неделе наблюдения?
    Теперь главный шаг: что я могу сделать прямо сейчас, опираясь на более реалистичную мысль, а не на катастрофический прогноз?
    Это может быть конкретное действие: написать сообщение, задать вопрос, сделать небольшой шаг по задаче, обратиться за информацией, которая прояснит ситуацию, вместо того чтобы продолжать домысливать.
    Определите одно такое действие и, если это уместно сегодня, выполните его.
    В завершение сформулируйте короткий итог недели. Моя частая тревожная мысль — это… Более реалистичная альтернатива звучит так… Действие, которое я выбираю вместо того, чтобы оставаться внутри тревожного сценария, — это…
    Сохраните этот итог в дневнике. Он пригодится позже, при сборке личного протокола в последнюю неделю программы.
- week: 5
  slot: T1
  code: TEXT_ANX_W5_T1
  days: 1-2
  title: 'Контроль или тревога: зачем я это проверяю?'
  text: |
    Эта практика связана с заданиями первых двух дней недели. Сегодня мы начинаем различать полезный контроль и тревожный контроль.
    Контроль сам по себе не является проблемой. Иногда он действительно нужен: проверить важные документы, перепроверить критичные данные, уточнить детали перед важным решением. Проблема начинается там, где контроль перестаёт снижать неопределённость и превращается в способ справляться с самой тревогой, а не с реальной задачей.
    Вспомните одну ситуацию, в которой вы недавно что-то проверяли, перепроверяли или искали дополнительное подтверждение.
    Опишите, что именно вы делали.
    Теперь спросите себя: какую цель я преследовал — получить недостающую практическую информацию или снизить своё внутреннее беспокойство?
    Иногда ответ очевиден сразу. Иногда полезно спросить дополнительно: если бы я уже обладал этой информацией раньше, перестал бы я проверять, или мне всё равно захотелось бы сделать это ещё раз?
    Если после получения ответа тревога ненадолго снижается, а затем желание проверить возвращается снова — это характерный признак тревожного контроля, а не практической необходимости.
    Посмотрите на эту проверку с точки зрения результата.
    Что эта проверка дала мне фактически нового?
    Изменилось ли что-то в реальной ситуации от того, что я проверил это ещё раз?
    Сколько времени продержалось облегчение после проверки?
    Запишите свой вывод: эта проверка была скорее полезным контролем или скорее тревожным контролем?
    В завершение сформулируйте короткое наблюдение: сегодня я заметил, что проверяю… Похоже, что за этим стоит потребность в…, а не реальная практическая необходимость. Сохраните эту запись в дневнике — она станет основой для работы в следующие дни.
- week: 5
  slot: T2
  code: TEXT_ANX_W5_T2
  days: 3-4
  title: Пауза перед повторной проверкой
  text: |
    Эта практика продолжает работу третьего и четвёртого дней недели. Теперь, когда вы научились замечать разницу между полезным и тревожным контролем, попробуем ввести паузу перед повторной проверкой.
    Вспомните ситуацию, в которой вам сейчас хочется что-то перепроверить, уточнить ещё раз или получить дополнительное подтверждение.
    Прежде чем действовать автоматически, остановитесь и задайте себе несколько вопросов.
    Проверял ли я это уже сегодня или недавно?
    Есть ли у меня реальная новая информация, из-за которой эта проверка необходима, или это повторение того же самого действия?
    Что я чувствую прямо сейчас — реальную практическую потребность или тревогу, которая требует немедленного снятия напряжения?
    Теперь попробуйте выдержать небольшую паузу перед действием. Не обязательно полностью отказываться от проверки — для начала достаточно отложить её на несколько минут.
    Засеките время: например, пять или десять минут. В течение этой паузы оставайтесь с тревогой, не подавляя её и не отвлекаясь специально. Просто замечайте: как меняется напряжение со временем, само по себе, без дополнительного действия?
    Часто тревога, если её не подкреплять новой проверкой, постепенно немного снижается сама, волнообразно, без вашего вмешательства.
    По истечении паузы спросите себя: сохранилась ли необходимость в проверке? Если да — возможно, это действительно важно сделать. Если желание ослабло — вы только что получили ценный опыт: напряжение может снижаться и без немедленного контроля.
    Запишите результат: сегодня я отложил проверку на… По итогу паузы я заметил, что… Это помогает увидеть, что тревога не обязана управлять моим поведением мгновенно.
- week: 5
  slot: T3
  code: TEXT_ANX_W5_T3
  days: 5-6
  title: Я могу выдержать небольшую неопределённость
  text: |
    Эта практика завершает неделю, посвящённую контролю и неопределённости, и связана с заданиями пятого и шестого дней.
    Неопределённость — одна из самых сложных вещей для тревожного мышления. Мозг, настроенный на поиск угрозы, стремится получить однозначный ответ как можно быстрее, даже если на самом деле точного ответа пока не существует.
    Сегодня мы потренируем способность оставаться с небольшой неопределённостью, не стремясь немедленно её устранить любой ценой.
    Вспомните одну текущую ситуацию, где у вас нет полной ясности: исход события пока неизвестен, ответ ещё не получен, результат станет понятен только позже.
    Опишите эту ситуацию.
    Теперь спросите себя: что я пытаюсь сделать прямо сейчас, чтобы получить определённость раньше времени? Проверяю, переспрашиваю, прокручиваю сценарии, ищу дополнительные гарантии?
    Попробуйте вместо этого сказать себе одну фразу: «Я пока не знаю, чем это закончится. Это неприятно, но я могу какое-то время оставаться с этим незнанием».
    Обратите внимание на телесную реакцию, которая при этом возникает. Не обязательно её подавлять. Достаточно позволить себе почувствовать дискомфорт неопределённости, не бросаясь немедленно его устранять.
    Попробуйте намеренно отложить одно действие, которое обычно вы совершаете именно для того, чтобы снять неопределённость раньше срока. Например, не писать повторное сообщение, не искать дополнительную информацию прямо сейчас, не просить у кого-то немедленного подтверждения.
    Отметьте, сколько времени вы смогли выдержать без этого действия, и что при этом происходило с вашим состоянием.
    В завершение сформулируйте итог недели: ситуация, в которой я тренировал выдерживание неопределённости, — это… Что я обычно делаю, чтобы получить определённость раньше времени, — это… Сегодня я смог… Этот опыт показывает мне, что я способен выдерживать больше неопределённости, чем мне казалось раньше.
    Сохраните эту запись — она понадобится при сборке личного протокола на последней неделе программы.
- week: 6
  slot: T1
  code: TEXT_ANX_W6_T1
  days: 1-2
  title: 'Моя карта тревоги: как начинался мой сценарий'
  text: |
    Эта практика связана с заданиями первых двух дней последней недели. Сейчас мы начинаем собирать всё, что вы заметили о своей тревоге за предыдущие пять недель, в единую карту.
    Вернитесь мысленно к своим записям первой недели — тем, где вы наблюдали, как тревога проявляется у вас: что её запускает, как реагирует тело, какие мысли появляются, что вы обычно делаете.
    Запишите заново, уже с опытом пяти недель: какие ситуации чаще всего запускают мою тревогу? Какой самый ранний телесный сигнал я у себя замечаю? Какая тревожная мысль повторяется чаще всего?
    Теперь посмотрите на привычную реакцию, которая раньше включалась автоматически: избегание, бесконечная проверка, поиск гарантий, катастрофизация.
    Какая из этих реакций была моей главной, наиболее типичной стратегией?
    Это и есть основа вашей личной карты тревоги — то, с чем вы будете работать дальше в последние дни этой недели.
- week: 6
  slot: T2
  code: TEXT_ANX_W6_T2
  days: 3-4
  title: Мой набор рабочих инструментов
  text: |
    Эта практика связана с заданиями третьего и четвёртого дней последней недели. Сейчас мы собираем инструменты, которые оказались для вас рабочими на протяжении всей программы.
    Вспомните вторую неделю — работу с телом: дыхание, мягкое мышечное отпускание, заземление, движение. Какой из этих способов оказался для вас самым действенным?
    Вспомните третью неделю — маленькие шаги навстречу тревоге вместо избегания. Какой опыт действия вместе с тревогой показался вам наиболее ценным?
    Вспомните четвёртую неделю — отделение факта от прогноза, проверку катастрофических сценариев. Какой вопрос или приём помогал вам лучше всего?
    Вспомните пятую неделю — различение полезного и тревожного контроля, выдерживание неопределённости. Что из этого вы хотите сохранить?
    Выберите из всего этого два или три инструмента, которые реально работают именно для вас — не те, что «должны» работать, а те, что подтвердились вашим собственным опытом.
    Запишите их коротко и конкретно, так, чтобы в трудный момент вы могли быстро вспомнить и применить их.
- week: 6
  slot: T3
  code: TEXT_ANX_W6_T3
  days: 5-6
  title: Мой план возвращения к себе
  text: |
    Эта практика связана с заданиями пятого и шестого дней последней недели и подводит нас к финальному протоколу.
    Подумайте о моменте, когда тревога уже возникла и начинает нарастать. Что обычно помогает вам не потеряться внутри неё полностью, а постепенно вернуться к более устойчивому состоянию?
    Вспомните свою личную опору — фразу, действие или образ, который напоминает вам, что вы можете справляться.
    Теперь продумайте: что вы делаете после того, как острая тревога спадает? Как вы возвращаетесь к обычным делам, не застревая в прокручивании ситуации заново и не избегая следующих похожих ситуаций?
    Опишите короткий план: когда тревога появляется — что я делаю сначала, что потом, как я возвращаюсь к обычной жизни после.
    Этот план станет основой личного анти-тревожного протокола, который мы соберём в последний день программы.
weeks:
- n: 1
  title: Понимание тревоги и наблюдение за собой
  intro_screen: На этой неделе мы не пытаемся убрать тревогу. Мы учимся видеть, как она устроена именно у вас — что её запускает, как реагирует тело, какие мысли появляются и что вы обычно делаете дальше.
  meaning: Тревога становится более управляемой не тогда, когда с ней борются, а когда она становится понятной.
  goal: Заметить свой личный сценарий тревоги в ситуации, теле, мыслях и поведении.
  result: Первая карта личного сценария тревоги.
  key_themes:
  - наблюдение
  - тело
  - мысли
  - поведение
  days:
  - d: 1
    title: Что такое тревога
    focus: Знакомство с идеей, что тревога — защитный механизм, а не поломка.
    task:
      text: ''
      subtasks:
      - Вспомнить одну недавнюю ситуацию с тревогой
      - Назвать само событие без оценок и выводов
      - Отметить, что тревога — это сигнал, а не факт опасности
    reflection:
    - Что я называю тревогой, когда говорю о своём состоянии?
    - Когда я в последний раз замечал это состояние?
    - Как я обычно реагирую, когда тревога появляется?
  - d: 2
    title: Тело тревоги
    focus: Наблюдение за телесными реакциями, сопровождающими тревогу.
    task:
      text: ''
      subtasks:
      - Вспомнить тревожный эпизод и восстановить телесные ощущения
      - Найти зону тела, где напряжение заметно сильнее всего
      - Найти более нейтральную или спокойную зону тела
    reflection:
    - Какие телесные ощущения я заметил сегодня?
    - Какую зону тела я назвал бы самой напряжённой?
    - Было ли в теле место, где спокойнее?
  - d: 3
    title: Мысли тревоги
    focus: Распознавание тревожных мыслей без попытки их оценивать или исправлять.
    task:
      text: ''
      subtasks:
      - Вспомнить тревожную ситуацию и восстановить мысль, которая появилась первой
      - Записать мысль дословно, без смягчения
      - Отметить, что это мысль, а не установленный факт
    reflection:
    - Какая мысль чаще всего сопровождает мою тревогу?
    - Звучит ли она у меня примерно одинаково в разных ситуациях?
    - Что я обычно делаю сразу после появления этой мысли?
  - d: 4
    title: Тревога и поведение
    focus: Наблюдение за тем, что тревога заставляет делать.
    task:
      text: ''
      subtasks:
      - Вспомнить, что захотелось сделать в момент тревоги
      - Сравнить желание сделать и то, что было сделано фактически
      - Отметить, было ли облегчение после действия
    reflection:
    - Что тревога чаще всего предлагает мне сделать?
    - Делаю ли я это обычно, или сдерживаю себя?
    - Что происходит с тревогой сразу после моего действия?
  - d: 5
    title: Реальная ситуация или тревожный прогноз
    focus: Первое знакомство с разницей между происходящим сейчас и тревожным предположением о будущем.
    task:
      text: ''
      subtasks:
      - Вспомнить ситуацию, где тревога говорила о будущем, а не о настоящем
      - Отделить то, что происходит сейчас, от того, что тревога предполагает
      - Заметить, насколько уверенно звучал этот прогноз
    reflection:
    - Про какую ситуацию последних дней тревога говорила мне худший исход?
    - Что из этого было фактом, а что — предположением?
    - Насколько сильно я поверил этому предположению?
  - d: 6
    title: Мой личный профиль тревоги
    focus: Сборка наблюдений недели в единую карту — ситуация, тело, мысль, поведение.
    task:
      text: ''
      subtasks:
      - Выбрать два-три наиболее частых запускающих момента
      - Назвать характерную телесную реакцию и повторяющуюся мысль
      - Назвать типичное поведение и то, что происходит после него
    reflection:
    - Как выглядит мой наиболее частый тревожный сценарий?
    - Что в нём я стал замечать быстрее, чем в начале недели?
    - Что хотя бы немного помогает мне не терять себя внутри тревоги?
  - d: 7
    title: Итог недели
