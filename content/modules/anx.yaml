    - С чем я хочу продолжить работать на следующей неделе?
- n: 2
  title: Тело и телесная регуляция тревоги
  intro_screen: На этой неделе мы работаем с телом — той частью тревожной реакции, которая часто включается раньше, чем человек успевает всё осмыслить.
  meaning: Тело можно научить замечать безопасность так же быстро, как оно замечает угрозу.
  goal: Освоить несколько простых способов телесной саморегуляции и научиться проверять реальность в моменте тревоги.
  result: Личный набор телесных способов снижения напряжения.
  key_themes:
  - тело
  - дыхание
  - мышечное напряжение
  - заземление
  days:
  - d: 1
    title: Тело как сигнал тревоги
    focus: Возвращение к теме телесного сигнала тревоги и его раннего распознавания.
    task:
      text: ''
      subtasks:
      - Несколько раз в течение дня спросить себя, что происходит в теле прямо сейчас
      - Отметить любые изменения в дыхании, мышцах или ощущениях
      - Не пытаться менять состояние, только замечать его
    reflection:
    - Какой телесный сигнал тревоги я заметил сегодня?
    - В какой момент дня он появился?
    - Что происходило вокруг в этот момент?
  - d: 2
    title: Карта моей телесной тревоги
    focus: Составление личной карты зон тела, в которых чаще всего проявляется напряжение.
    task:
      text: ''
      subtasks:
      - Пройтись вниманием по телу от лица до стоп
      - Отметить зоны с напряжением и зоны с относительным спокойствием
      - Назвать свой наиболее характерный телесный признак тревоги
    reflection:
    - Какая зона тела у меня напрягается чаще всего?
    - Есть ли зона, которая остаётся спокойной даже при тревоге?
    - Как я опишу свой личный телесный сигнал одним словом?
  - d: 3
    title: Дыхание и возбуждение
    focus: Практика удлинённого выдоха как способа мягкого снижения физиологического возбуждения.
    task:
      text: ''
      subtasks:
      - Сделать несколько циклов обычного вдоха и чуть более длинного выдоха
      - Остановиться при любом дискомфорте и вернуться к обычному дыханию
      - Отметить, что изменилось в теле после упражнения
    reflection:
    - Что изменилось в теле после работы с дыханием?
    - Было ли мне комфортно замедлять выдох?
    - Хочу ли я использовать этот способ ещё раз?
  - d: 4
    title: Мышечное напряжение и отпускание
    focus: Контрастное напряжение и расслабление одной мышечной зоны.
    task:
      text: ''
      subtasks:
      - Выбрать одну зону тела и мягко напрячь её на несколько секунд
      - Отпустить напряжение и заметить разницу в ощущениях
      - Повторить ещё один-два раза, если комфортно
    reflection:
    - Какую зону тела я выбрал для упражнения?
    - Что я почувствовал в момент отпускания напряжения?
    - Насколько заметной была разница до и после?
  - d: 5
    title: Возвращение в настоящий момент
    focus: Заземление через органы чувств — зрение, слух, опору.
    task:
      text: ''
      subtasks:
      - Найти глазами три предмета вокруг себя
      - Услышать один близкий и один более далёкий звук
      - Почувствовать опору под стопами или телом
    reflection:
    - Что я заметил вокруг себя, когда выполнял упражнение?
    - Помогло ли это хоть немного вернуть внимание в настоящий момент?
    - В какой ситуации этот способ может быть полезен мне в будущем?
  - d: 6
    title: Опора и движение
    focus: Использование движения тела как способа выйти из застывания или чрезмерного возбуждения.
    task:
      text: ''
      subtasks:
      - Сделать несколько осознанных шагов или сменить положение тела
      - Почувствовать вес тела и контакт стоп с поверхностью
      - Отметить, что изменилось в состоянии после движения
    reflection:
    - Как я себя чувствовал до и после движения?
    - Какое движение показалось мне наиболее естественным?
    - Хочу ли я добавить этот способ в свой обычный день?
  - d: 7
    title: Итог недели
    focus: Выбор наиболее рабочих способов телесной регуляции для дальнейшего использования.
    task:
      text: ''
      subtasks:
      - Перечитать наблюдения недели о дыхании, мышцах, заземлении и движении
      - Выбрать один-два способа, которые сработали лучше всего
      - Записать короткий план, как использовать их в повседневной жизни
    reflection:
    - Какие телесные сигналы тревоги я стал замечать быстрее на этой неделе?
    - Какой способ — наблюдение тела, дыхание, мышечное отпускание, опора или движение — оказался для меня самым рабочим?
    - Какой один навык этой недели я хочу продолжить использовать дальше?
- n: 3
  title: Выход из избегания и первые маленькие действия навстречу тревоге
  intro_screen: На этой неделе мы учимся замечать избегание и пробовать маленькие посильные шаги навстречу тревожным ситуациям.
  meaning: Краткое облегчение от избегания часто имеет долгосрочную цену — ситуация остаётся нерешённой.
  goal: Увидеть свою карту избегания и получить опыт действия при наличии тревоги.
  result: Опыт хотя бы одного реального шага навстречу тревожной ситуации.
  key_themes:
  - избегание
  - маленькие шаги
  - защитное поведение
  - новый опыт
  days:
  - d: 1
    title: Как тревога создаёт избегание
    focus: Знакомство с механизмом, по которому тревога закрепляет избегание через краткое облегчение.
    task:
      text: ''
      subtasks:
      - Вспомнить одну повторяющуюся ситуацию избегания
      - Назвать её одним конкретным предложением
      - Отметить, какое облегчение избегание приносит сразу
    reflection:
    - Какую ситуацию я чаще всего откладываю или избегаю?
    - Что я чувствую сразу после того, как избежал её?
    - Что происходит с этой ситуацией через какое-то время?
  - d: 2
    title: Карта избегания
    focus: Построение полной цепочки — ситуация, прогноз тревоги, избегание, краткое облегчение, долгосрочная цена.
    task:
      text: ''
      subtasks:
      - Восстановить прогноз тревоги в выбранной ситуации
      - Описать типичное избегающее поведение
      - Назвать долгосрочную цену этого избегания
    reflection:
    - Какой прогноз даёт моя тревога в этой ситуации?
    - Что я теряю, продолжая избегать её?
    - Что изменилось бы, если бы я действовал иначе?
  - d: 3
    title: Маленький шаг вместо большого рывка
    focus: Определение минимального посильного шага навстречу тревожной ситуации.
    task:
      text: ''
      subtasks:
      - Выбрать ситуацию избегания из предыдущих дней
      - Определить самый маленький конкретный шаг
      - Убедиться, что шаг сформулирован как действие, а не как чувство
    reflection:
    - Какой маленький шаг я выбрал?
    - Почему именно такой размер шага показался мне посильным?
    - Что я ожидаю почувствовать перед его выполнением?
  - d: 4
    title: Действовать вместе с тревогой
    focus: Опыт выполнения выбранного шага при сохраняющейся тревоге, без ожидания полного спокойствия.
    task:
      text: ''
      subtasks:
      - Выполнить выбранный маленький шаг
      - Сравнить прогноз тревоги с тем, что произошло фактически
      - Отметить, что оказалось легче или труднее ожидаемого
    reflection:
    - Что я ожидал до действия и что произошло на самом деле?
    - Удалось ли мне начать, несмотря на тревогу?
    - Что я чувствую сейчас, вспоминая этот шаг?
  - d: 5
    title: Защитное поведение
    focus: Знакомство с идеей избыточной подстраховки — проверок и гарантий сверх необходимого.
    task:
      text: ''
      subtasks:
      - Выбрать ситуацию, где я особенно стараюсь подстраховаться
      - Назвать, какую гарантию я пытаюсь получить этим поведением
      - Отметить, сколько времени гарантия реально успокаивает
    reflection:
    - Какую дополнительную страховку я чаще всего использую?
    - Какую гарантию я пытаюсь получить этим действием?
    - Возвращается ли тревога вскоре после такой страховки?
  - d: 6
    title: Новый опыт
    focus: Небольшой эксперимент с уменьшением одной лишней подстраховки.
    task:
      text: ''
      subtasks:
      - Выбрать одну лишнюю страховку, которую можно немного уменьшить
      - Зафиксировать прогноз тревоги перед экспериментом
      - Выполнить действие с меньшей подстраховкой и сравнить с прогнозом
    reflection:
    - Что я ожидал почувствовать без привычной страховки?
    - Что произошло в реальности?
    - Смог ли я выдержать неопределённость без прежнего контроля?
  - d: 7
    title: Итог недели
    focus: Сбор опыта недели — от избегания к первым посильным действиям.
    task:
      text: ''
      subtasks:
      - Перечитать записи о выбранных шагах и экспериментах недели
      - Назвать самый важный шаг этой недели
      - Отметить, что нового о себе я узнал из реального опыта
    reflection:
    - Какой маленький шаг этой недели оказался для меня самым важным?
    - Что я ожидал до него и что произошло во время и после?
    - Что я теперь знаю из собственного опыта, а не только предполагаю?
- n: 4
  title: Тревожные мысли и катастрофизация
  intro_screen: На этой неделе мы учимся отделять факт от тревожного прогноза и проверять катастрофические сценарии доказательствами.
  meaning: Тревожная мысль звучит как факт, но часто является лишь одним из возможных предположений.
  goal: Освоить навык разделения факта и прогноза и проверки катастрофических сценариев.
  result: Личный пример реалистичной альтернативы тревожной мысли.
  key_themes:
  - мысли
  - факт и прогноз
  - катастрофизация
  - альтернативная мысль
  days:
  - d: 1
    title: Мысль — это не факт
    focus: Знакомство с идеей, что тревожная мысль ощущается как истина, но является отдельным явлением от факта.
    task:
      text: ''
      subtasks:
      - Вспомнить одну недавнюю тревожную мысль
      - Записать её дословно
      - Отметить, насколько уверенно она звучала
    reflection:
    - Какая тревожная мысль чаще всего повторяется у меня?
    - Воспринимаю ли я её обычно как установленный факт?
    - Что изменится, если я назову её просто мыслью, а не истиной?
  - d: 2
    title: Факт, интерпретация и прогноз
    focus: Разделение тревожной мысли на фактическую часть и прогноз или интерпретацию.
    task:
      text: ''
      subtasks:
      - Разделить свою мысль на факт и прогноз
      - Найти два-три альтернативных объяснения того же факта
      - Оценить уверенность в своём прогнозе до и после поиска альтернатив
    reflection:
    - Что в моей мысли является фактом, а что — прогнозом?
    - Какое альтернативное объяснение показалось мне наиболее правдоподобным?
    - Изменилась ли моя уверенность в первоначальном прогнозе?
  - d: 3
    title: Как работает катастрофизация
    focus: Знакомство с цепочкой катастрофических мыслей и её автоматичностью.
    task:
      text: ''
      subtasks:
      - Вспомнить ситуацию с катастрофическим сценарием
      - Записать всю цепочку мыслей шаг за шагом
      - Отметить, какое звено цепочки появилось первым
    reflection:
    - Как звучит моя типичная катастрофическая цепочка?
    - Какое событие запускает её чаще всего?
    - Насколько быстро эта цепочка разворачивается у меня в голове?
  - d: 4
    title: Проверка доказательств
    focus: Проверка вероятности каждого звена катастрофической цепочки через доказательства.
    task:
      text: ''
      subtasks:
      - Оценить вероятность первого звена цепочки от 0 до 100
      - Найти доказательства за и против
      - Оценить вероятность всей цепочки целиком
    reflection:
    - Какой была вероятность первого события при реалистичной оценке?
    - Насколько вероятной оказалась вся цепочка целиком?
    - Что бы я сделал, даже если бы часть худшего сценария случилась?
  - d: 5
    title: Альтернативная мысль
    focus: Формулирование более сбалансированной, реалистичной альтернативы тревожной мысли.
    task:
      text: ''
      subtasks:
      - Взять часто повторяющуюся тревожную мысль
      - Сформулировать рядом более реалистичную альтернативу
      - Сравнить обе формулировки с учётом собранных фактов
    reflection:
    - Как звучит моя тревожная мысль и её реалистичная альтернатива?
    - Какая из формулировок точнее описывает ситуацию?
    - Что я чувствую, читая более сбалансированную версию?
  - d: 6
    title: Что я могу сделать сейчас
    focus: Переход от реалистичной мысли к конкретному действию вместо продолжения тревожного сценария.
    task:
      text: ''
      subtasks:
      - Опираясь на реалистичную мысль, выбрать одно конкретное действие
      - Выполнить это действие, если это уместно сегодня
      - Отметить, что изменилось после действия
    reflection:
    - Какое действие я выбрал вместо того, чтобы оставаться внутри тревожного сценария?
    - Что произошло после того, как я это сделал?
    - Насколько реалистичная мысль помогла мне принять решение?
  - d: 7
    title: Итог недели
    focus: Подведение итогов работы с тревожными мыслями и катастрофизацией.
    task:
      text: ''
      subtasks:
      - Перечитать записи недели о мыслях, фактах и прогнозах
      - Выбрать главный навык недели
      - Сформулировать, как использовать его в будущем
    reflection:
    - Какие тревожные мысли повторялись у меня чаще всего на этой неделе?
    - В какой ситуации катастрофизация захватила меня сильнее всего?
    - Какой навык различения мысли и факта я хочу взять с собой в следующую неделю?
- n: 5
  title: Контроль, неопределённость, проверки и поиск гарантий
  intro_screen: На этой неделе мы учимся различать полезный контроль и тревожный контроль и тренируем способность выдерживать небольшую неопределённость.
  meaning: Тревожный контроль снижает напряжение ненадолго, но не даёт реальной определённости и закрепляет саму тревогу.
  goal: Заметить разницу между полезным и тревожным контролем и получить опыт выдерживания неопределённости.
  result: Личный опыт паузы перед проверкой и выдерживания неопределённости.
  key_themes:
  - контроль
  - проверки
  - гарантии
  - неопределённость
  days:
  - d: 1
    title: Как тревога требует контроля
    focus: Знакомство с темой контроля как способа справляться с тревогой.
    task:
      text: ''
      subtasks:
      - Вспомнить ситуацию, в которой тревога заставляла что-то контролировать
      - Описать, что именно вы пытались контролировать
      - Отметить, насколько это было в ваших силах на самом деле
    reflection:
    - Что я чаще всего пытаюсь контролировать из-за тревоги?
    - Насколько это действительно в моей власти?
    - Что происходит, когда контроль оказывается невозможным?
  - d: 2
    title: Полезный контроль и тревожный контроль
    focus: Различение практически необходимого контроля и контроля, направленного на снижение тревоги.
    task:
      text: ''
      subtasks:
      - Вспомнить недавнюю проверку или перепроверку
      - Определить, была ли цель практической или эмоциональной
      - Оценить, что эта проверка дала фактически нового
    reflection:
    - Эта проверка была скорее полезным контролем или тревожным контролем?
    - Что изменилось в реальной ситуации после проверки?
    - Сколько времени продержалось облегчение после неё?
  - d: 3
    title: Проверки и перепроверки
    focus: Наблюдение за частотой и триггерами повторных проверок.
    task:
      text: ''
      subtasks:
      - Отследить в течение дня моменты желания что-то перепроверить
      - Отметить, что предшествовало этому желанию
      - Записать, сколько раз возникало повторное желание проверить то же самое
    reflection:
    - Что я сегодня проверял или перепроверял чаще всего?
    - Что обычно предшествует этому желанию?
    - Возвращалось ли желание проверить снова после уже сделанной проверки?
  - d: 4
    title: Поиск гарантий
    focus: Знакомство с привычкой искать у других людей подтверждение и гарантии безопасности.
    task:
      text: ''
      subtasks:
      - Вспомнить ситуацию поиска гарантии у другого человека
      - Отметить, какой вопрос или какую фразу вы обычно используете
      - Оценить, насколько надолго такая гарантия снижает тревогу
    reflection:
    - У кого и о чём я чаще всего ищу подтверждение?
    - Что я получаю от этого подтверждения на самом деле?
    - Что происходит с тревогой через некоторое время после него?
  - d: 5
    title: Тренировка небольшой неопределённости
    focus: Намеренное откладывание проверки и наблюдение за тем, как меняется напряжение со временем.
    task:
      text: ''
      subtasks:
      - Выбрать ситуацию, где хочется проверить или уточнить что-то снова
      - Отложить проверку на несколько минут и остаться с тревогой
      - Отметить, как изменилось напряжение к концу паузы
    reflection:
    - На сколько минут я смог отложить проверку?
    - Что происходило с моим состоянием во время паузы?
    - Сохранилась ли необходимость в проверке после паузы?
  - d: 6
    title: От контроля к ближайшему действию
    focus: Переход от попыток контролировать неопределённость к выбору одного реалистичного действия.
    task:
      text: ''
      subtasks:
      - Выбрать ситуацию с неопределённым исходом
      - Определить, что реально зависит от меня в этой ситуации
      - Выбрать одно конкретное действие вместо попытки всё проконтролировать
    reflection:
    - Что в этой ситуации зависит от меня, а что нет?
    - Какое действие я выбрал вместо попытки получить полную гарантию?
    - Что я почувствовал, приняв это решение?
  - d: 7
    title: Итог недели
    focus: Подведение итогов работы с контролем, проверками и неопределённостью.
    task:
      text: ''
      subtasks:
      - Перечитать записи недели о контроле и неопределённости
      - Выбрать главное наблюдение недели
      - Сформулировать, что хочется взять с собой дальше
    reflection:
    - Какая проверка или перепроверка повторялась у меня чаще всего на этой неделе?
    - Где я смог выдержать хотя бы небольшую неопределённость, не бросаясь сразу проверять?
    - Какой навык этой недели я хочу взять с собой в шестую неделю?
