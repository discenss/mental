passport:
  name: Тревога
  intro: 'Если мозг постоянно живёт в режиме угрозы и не умеет выключаться. Мысли
    не останавливаются, трудно расслабиться, сложно отпустить контроль, тело всё
    время напряжено, а будущее воспринимается как источник проблем.


    Тревога — естественная защитная система организма. Сложность начинается тогда,
    когда сигнал опасности включается слишком часто, слишком сильно или без реальной
    угрозы — и начинает управлять мыслями, телом и поведением.


    Этот маршрут не ставит целью «убрать» тревогу. Его задача — сделать тревожную
    реакцию понятной: научиться замечать её раньше, различать факт и тревожный прогноз,
    не уходить автоматически в избегание или бесконечный контроль и постепенно возвращать
    себе выбор между автоматической реакцией и осознанным действием.

    '
  for_whom:
  - мозг часто живёт в режиме ожидания угрозы, даже когда явной опасности рядом нет
  - 'мысли трудно остановить: прокручиваются одни и те же сценарии, прогнозы, «а
    вдруг»'
  - тело часто напряжено, сложно расслабиться, дышать спокойно или отпустить контроль
  - вы постоянно что-то проверяете, перепроверяете или ищете гарантии, что всё будет
    хорошо
  - тревога заставляет откладывать, избегать разговоров, ситуаций или решений
  - будущее чаще воспринимается как источник проблем, а не как открытая возможность
  extra_support: 'Если тревога проявляется как панические атаки, диагностированное
    тревожное расстройство, выраженная дезорганизация, или сопровождается мыслями
    о самоповреждении, маршрут лучше использовать только как дополнительный поддерживающий
    инструмент, а не как основной способ справиться с состоянием.


    В таких ситуациях важно обратиться к врачу или психотерапевту. Программу можно
    проходить параллельно с профессиональной помощью, но она не заменяет её и не
    предназначена для кризисных состояний.


    Если отдельное задание вызывает слишком сильную тревогу, можно выполнить его
    короче, выбрать более лёгкую ситуацию или вернуться к нему позже. Маршрут не
    требует начинать с самых тяжёлых случаев.

    '
  what_happens: 'На протяжении шести недель вы будете постепенно переходить от наблюдения
    к пониманию и действию. Сначала важно увидеть, как тревога проявляется именно
    у вас. Затем — научиться распознавать её в теле и мягко снижать физиологическое
    напряжение. После этого вы начнёте возвращать себе действие там, где тревога
    обычно вела к избеганию, учиться отделять тревожную мысль от факта и замечать
    катастрофические сценарии. Дальше — различать полезный контроль и тревожную
    проверку, выдерживать небольшую неопределённость. В последнюю неделю всё это
    собирается в единый личный анти-тревожный протокол.


    от общего ощущения «мне постоянно тревожно» — к пониманию личного сценария:
    что запускает тревогу, как реагирует тело, какие мысли и действия повторяются

    от борьбы с тревогой — к наблюдению за ней и мягкой телесной регуляции

    от автоматического избегания — к маленьким посильным шагам навстречу тревожной
    ситуации

    от веры каждой тревожной мысли — к умению отделять факт от прогноза и катастрофического
    сценария

    от бесконечных проверок и поиска гарантий — к разумному действию и переносимости
    неопределённости

    от разрозненных техник — к одному понятному личному протоколу и SOS-карточке
    на момент тревоги

    '
  why: 'Тревога — это защитная система организма: она предупреждает, обращает внимание,
    заставляет быть осторожнее. Проблема начинается не от самого существования тревоги,
    а от того, что она включается слишком часто, слишком сильно или без реальной
    угрозы — и начинает определять мысли, тело и поведение сильнее, чем сам человек.


    Когда тревогу не удаётся сделать понятной, с ней обычно либо постоянно борются,
    либо во всём ей подчиняются: избегают важных ситуаций, без конца всё проверяют,
    ищут гарантии или прокручивают катастрофические сценарии. Оба пути поддерживают
    тревогу, а не снижают её.


    Эта программа не предлагает заставить тревогу исчезнуть усилием воли. Она помогает
    увидеть, как тревога работает именно у вас, и постепенно вернуть пространство
    выбора между автоматической реакцией и осознанным действием.

    '
  what_user_gets:
  - 'понимание своего личного сценария тревоги: что её запускает, как реагирует
    тело, какие мысли и действия повторяются'
  - рабочие способы телесной саморегуляции — дыхание, мягкое отпускание мышечного
    напряжения, заземление и движение
  - навык отделять факт от тревожного домысла и прогноза, проверять катастрофические
    сценарии через доказательства
  - опыт небольших посильных шагов навстречу тревоге вместо автоматического избегания
    и защитного поведения
  - навык различать полезный контроль и тревожные проверки или поиск гарантий, выдерживать
    небольшую неопределённость
  - личный анти-тревожный протокол и короткую SOS-карточку на случай сильной тревоги
  main_result: 'Главный результат маршрута — не полное исчезновение тревоги. Тревога
    — естественная часть психики, и это не было целью программы.


    Главный результат в другом: между появлением тревоги и автоматической реакцией
    появляется пространство для выбора. Вы начинаете замечать тревогу раньше, отделять
    факт от тревожного прогноза, не уходить сразу в избегание или бесконечный контроль
    — и выбирать, что делать дальше, вместо того чтобы позволять тревоге решать за
    вас.

    '
  important: 'Это самостоятельный психообразовательный маршрут, а не психотерапия
    и не замена медицинской помощи. Он не ставит целью полностью убрать тревогу
    и не требует становиться человеком, которому всё равно.


    Если тревога проявляется как панические атаки, диагностированное тревожное расстройство
    или сопровождается мыслями о самоповреждении — обратитесь к врачу или психотерапевту.
    Программу можно проходить параллельно, но в таких случаях она не заменяет профессиональную
    помощь.

    '
