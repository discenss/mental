text_map:
- week: 1
  slot: T1
  code: TEXT_ANX_W1_T1
  days: 1-2
  title: Как проявляется моя тревога
  text: |
    Первая неделя посвящена наблюдению за тревогой. Эта практика не требует немедленно успокоиться, изменить мысли или избавиться от тревоги. Её задача — помочь заметить собственный тревожный сценарий: что его запускает, как реагирует тело, какие мысли появляются и что человек делает дальше.
    Сегодня мы не будем пытаться убрать тревогу. Не будем убеждать себя, что всё хорошо, заставлять себя расслабляться или искать правильные мысли. Задача этой практики гораздо проще: увидеть, как тревога проявляется именно у вас.
    Тревога редко возникает как одно отдельное чувство. Обычно это целая последовательность реакций. Что-то происходит — иногда во внешнем мире, иногда только в наших мыслях. Тело реагирует. Появляются определённые мысли. Возникает желание что-то сделать: проверить, избежать, отложить, спросить, отменить, ускориться, уйти, замереть. Часто всё это происходит настолько быстро, что воспринимается как одно состояние: «мне тревожно».
    Попробуйте вспомнить одну недавнюю ситуацию, в которой вы почувствовали тревогу. Не обязательно выбирать самую тяжёлую. Лучше взять обычный эпизод, который вы можете спокойно рассмотреть сейчас. Это может быть ожидание сообщения, разговор, рабочая задача, неприятное ощущение в теле, мысль о будущем, новость, необходимость принять решение или ситуация, когда вы не знали, что будет дальше.
    Сначала просто назовите ситуацию.
    Что произошло?
    Постарайтесь описать только событие, без объяснений и выводов. Например: «Мне не ответили на сообщение», «Мне нужно было выступить», «Я почувствовал сердцебиение», «Начальник попросил поговорить», «Я вспомнил о предстоящем обследовании».
    Теперь обратите внимание на тело.
    Что произошло в теле в тот момент?
    Возможно, напряглись плечи или челюсть. Изменилось дыхание. Появилось сердцебиение. Возникло ощущение тяжести или пустоты в животе. Стало жарко или холодно. Захотелось двигаться или, наоборот, замереть. Возможно, вы не помните никаких выраженных ощущений. Это тоже ответ. Не нужно искать симптом, которого не было.
    Попробуйте определить, какое телесное изменение вы заметили первым.
    А теперь вспомните мысль.
    Что вы сказали себе в этот момент?
    Не ищите красивую или логичную формулировку. Важно поймать мысль примерно в том виде, в котором она возникла: «Что-то не так», «А вдруг случится…», «Я не справлюсь», «Почему он не отвечает?», «Наверное, всё плохо», «Надо срочно что-то делать».
    Иногда человек говорит: «У меня не было мысли, мне просто стало тревожно». Такое возможно. Тогда попробуйте спросить себя: если бы тревога могла говорить, о чём бы она предупреждала меня в тот момент?
    Не спорьте с этой мыслью. Сейчас не нужно выяснять, правильная она или неправильная. Нам важно только заметить её.
    Следующий шаг — поведение.
    Что вам захотелось сделать после появления тревоги?
    Проверить телефон? Перечитать сообщение? Позвонить кому-то? Отменить встречу? Отложить задачу? Найти информацию в интернете? Спросить другого человека, всё ли будет хорошо? Быстро закончить неприятное дело? Уйти из ситуации? Замолчать? Начать суетиться?
    И что вы действительно сделали?
    Иногда желание и действие отличаются. Например, хотелось уйти, но вы остались. Хотелось десять раз проверить, но проверили один. Или наоборот: сначала не собирались ничего делать, а через несколько минут обнаружили, что уже ищете подтверждения своей тревоги.
    Теперь посмотрите на весь эпизод целиком.
    Ситуация.
    Тело.
    Мысль.
    Действие или импульс к действию.
    Это и есть первая схема, которую мы будем учиться замечать.
    Не пытайтесь сейчас определить, какой элемент «главный». У одного человека тревога быстрее всего обнаруживается в теле. Другой сначала замечает мысли. Третий понимает, что тревожится, только когда видит собственное поведение: откладывает, проверяет, избегает, раздражается или начинает всё контролировать.
    Попробуйте вспомнить ещё одну тревожную ситуацию последних дней и быстро пройти тот же путь.
    Что произошло?
    Что изменилось в теле?
    Какая мысль появилась?
    Что захотелось сделать?
    Что вы сделали?
    Сравните две ситуации. Есть ли между ними что-то похожее?
    Возможно, повторяется одно и то же телесное ощущение. Возможно, тревога каждый раз говорит примерно одно: «Я не справлюсь», «Надо быть уверенным», «Что-то обязательно произойдёт». Возможно, повторяется действие: проверять, откладывать, избегать, искать поддержку или пытаться всё контролировать.
    Не нужно делать окончательный вывод. Сейчас достаточно увидеть хотя бы одно повторение.
    На протяжении ближайших дней попробуйте использовать очень короткий внутренний вопрос: «Что сейчас происходит со мной?»
    Не «как мне это убрать?», не «почему я опять тревожусь?», а именно: «Что сейчас происходит?»
    Где это чувствуется в теле?
    Какая мысль появилась?
    Что тревога предлагает мне сделать?
    Так постепенно тревога перестаёт быть одним большим непонятным состоянием и начинает раскладываться на элементы, которые можно наблюдать.
    Если во время практики вы обнаружили что-то важное, запишите или надиктуйте это в дневник своими словами. Не обязательно отвечать красиво или подробно. Можно оставить одну фразу: «Когда мне долго не отвечают, я чувствую напряжение в груди, думаю, что случилось что-то плохое, и начинаю проверять телефон».
    Этого уже достаточно.
    В конце практики ответьте себе на три вопроса.
    Как я чаще всего понимаю, что тревога началась?
    Что я замечаю раньше — тело, мысль или своё поведение?
    Какое действие тревога чаще всего предлагает мне сделать?
    Не нужно стремиться получить правильный ответ. В течение недели он ещё может измениться. Сейчас мы только начинаем знакомиться с тем, как устроена именно ваша тревога. На сегодня этого достаточно. Возможно, вы заметили совсем немного — одно ощущение, одну мысль или одну привычную реакцию. Этого достаточно для начала. Понимание себя складывается не за один раз, а из небольших наблюдений. То, что сегодня осталось неясным, можно просто оставить без ответа и вернуться к этому позже.
- week: 1
  slot: T2
  code: TEXT_ANX_W1_T2
  days: 3-4
  title: Замечаю тревожный сигнал
  text: |
    В первой практике мы начали раскладывать тревогу на отдельные элементы: ситуация, тело, мысль и действие. Теперь попробуем приблизиться к моменту, когда тревога только начинает набирать силу.
    Обычно мы замечаем тревогу уже тогда, когда она стала достаточно выраженной. Мысли успели раскрутиться, тело напряжено, а мы уже что-то проверяем, избегаем, откладываем или пытаемся срочно вернуть контроль. Но у тревоги часто есть более ранний сигнал.
    Сегодня задача не в том, чтобы остановить тревогу. Задача — заметить её немного раньше.
    Вспомните ситуацию последних дней, когда тревога постепенно усиливалась.
    Попробуйте мысленно вернуться не в самый тяжёлый момент, а немного раньше.
    Что происходило непосредственно перед тем, как вы поняли: «Я тревожусь»?
    Может быть, вы увидели сообщение. Услышали определённую фразу. Вспомнили о предстоящем событии. Почувствовали что-то в теле. Представили возможный исход. Столкнулись с неопределённостью.
    Попробуйте найти этот момент.
    Теперь вспомните первую тревожную мысль, которую можете уловить.
    Она могла быть очень короткой: «А если…», «Что-то не так», «Опять начинается», «Надо проверить», «Я не успею», «Это опасно», «Он, наверное…».
    Не нужно исправлять эту мысль. На этой неделе мы специально не занимаемся тем, насколько она рациональна и чем её заменить. Для этого будет отдельная работа позже. Сейчас важнее научиться узнавать тревожную мысль в момент её появления.
    Представьте, что вы не обязаны верить ей и не обязаны спорить с ней. Вы просто замечаете: «Вот появилась тревожная мысль».
    Как она звучит у вас?
    Если хотите, запишите её дословно.
    Теперь обратите внимание, что происходит сразу после этой мысли.
    Меняется ли тело?
    Становится ли дыхание более поверхностным? Напрягаются ли мышцы? Появляется ли неприятное ощущение в груди или животе? Возникает ли внутреннее возбуждение?
    А что происходит с вниманием?
    Остаётся ли оно на текущей задаче или начинает сужаться вокруг возможной проблемы? Возникает ли желание снова и снова возвращаться к одной теме?
    Теперь посмотрите на следующий шаг.
    Что вам хочется сделать, когда тревожная мысль становится убедительной?
    Например, мысль «Наверное, что-то случилось» может вести к проверке телефона. Мысль «Я не справлюсь» — к откладыванию. «Мне нужно быть уверенным» — к повторным проверкам. «Я могу плохо себя почувствовать» — к избеганию места или ситуации.
    Не оценивайте это поведение как хорошее или плохое. Сейчас мы изучаем последовательность.
    Попробуйте сформулировать её одной строкой:
    «Когда происходит ______, у меня появляется мысль ______, тело реагирует ______, и мне хочется ______».
    Прочитайте эту фразу ещё раз.
    Насколько она похожа на ваш обычный тревожный сценарий?
    Теперь вспомните другую ситуацию. Возможно, совершенно из другой области жизни. Например, первая была связана с работой, а вторая — со здоровьем или отношениями.
    Снова найдите ранний сигнал.
    Что произошло?
    Какая мысль появилась первой?
    Как отреагировало тело?
    Что захотелось сделать?
    Есть ли что-то общее между двумя ситуациями?
    Иногда события разные, но внутренняя тема одна и та же: страх ошибиться, потерять контроль, столкнуться с неопределённостью, получить плохую новость, быть отвергнутым, не справиться.
    Не нужно сейчас давать этой теме психологическое название. Достаточно заметить повторение.
    Есть ещё один важный момент. Иногда тревога начинается не с внешней ситуации, а с ощущения в теле. Например, человек замечает сердцебиение, головокружение или напряжение, затем появляется мысль: «Почему это?», «Со мной что-то не так», и уже после этого тревога усиливается.
    Если это похоже на вас, попробуйте отметить эту последовательность отдельно.
    Телесное ощущение.
    Мысль о нём.
    Рост тревоги.
    Последующее действие.
    В других случаях первым сигналом становится мысль о будущем. Тогда тело подключается уже после неё.
    Нам не нужно решить, какой вариант правильный. Мы ищем ваш вариант.
    В течение ближайших дней попробуйте иногда задавать себе один вопрос: «Что было за несколько секунд или минут до того, как тревога стала заметной?»
    Этот вопрос постепенно тренирует способность замечать начало реакции.
    Если вы заметили тревожный сигнал, не требуйте от себя тут же успокоиться. Сам факт, что вы его заметили, уже является результатом этой недели.
    Запишите или надиктуйте в дневник один пример. Это может быть совсем короткая запись: «Перед звонком я подумал, что сейчас услышу плохую новость. Напрягся живот. Захотелось отложить звонок».
    Такие записи постепенно создают карту тревоги, которая намного полезнее общего ощущения «я часто тревожусь».
    В завершение ответьте себе на три вопроса.
    Какой ранний сигнал тревоги я замечаю чаще всего?
    Какая тревожная мысль у меня повторяется?
    Что обычно происходит сразу после неё — в теле и в поведении?
    Не пытайтесь исправить найденный сценарий. Пока достаточно научиться видеть его. Чем точнее человек замечает момент запуска тревоги, тем больше возможностей для дальнейшей работы появляется позже. Не обязательно замечать тревогу каждый раз и не обязательно успевать поймать самый первый её сигнал. Этот навык формируется постепенно. Иногда достаточно уже после ситуации понять: вот здесь всё началось. Со временем такие моменты могут становиться более заметными. На сегодня просто сохраните то, что удалось увидеть.
- week: 1
  slot: T3
  code: TEXT_ANX_W1_T3
  days: 5-6
  title: Мой личный профиль тревоги
  text: |
    За последние дни вы наблюдали тревогу с разных сторон. Замечали тело, мысли, действия и пытались увидеть момент, когда тревожная реакция только начинается. Теперь соберём эти наблюдения в одну картину.
    У тревоги нет одного универсального сценария. Два человека могут одинаково сказать: «Я тревожусь», но внутри это будут совершенно разные процессы. Один прежде всего ощущает тело. Другой постоянно прокручивает будущие события. Третий начинает избегать. Четвёртый пытается всё контролировать и проверять.
    Сегодня мы создадим ваш личный профиль тревоги.
    Это не диагноз и не окончательное описание личности. Это рабочая карта того, что вы успели заметить за первую неделю. Она может дополняться и меняться.
    Начнём с того, что запускает тревогу.
    Вспомните несколько ситуаций этой недели.
    Когда тревога появлялась чаще?
    Когда нужно было ждать?
    Когда не хватало информации?
    Когда нужно было принять решение?
    При неприятных телесных ощущениях?
    В разговорах с определёнными людьми?
    При мыслях о будущем?
    Во время работы?
    После новостей?
    Когда возникала вероятность ошибки?
    Выберите два или три наиболее частых запускающих момента.
    Сформулируйте: «Моя тревога чаще появляется, когда…»
    Теперь перейдите к телу.
    Какие телесные реакции повторялись?
    Не перечисляйте всё, что вообще бывает при тревоге. Отметьте именно своё.
    Где появляется напряжение?
    Что происходит с дыханием?
    Есть ли сердцебиение, дрожь, слабость, тяжесть, внутреннее возбуждение, ком в горле, неприятные ощущения в животе?
    Какой телесный признак можно назвать наиболее характерным для вас?
    Теперь мысли.
    Какие фразы повторялись в голове?
    Не обязательно дословно. Важно уловить общий смысл.
    «Что-то может случиться».
    «Я не справлюсь».
    «Мне нужно знать точно».
    «Я могу ошибиться».
    «Я не успею».
    «Это может закончиться плохо».
    «Надо срочно что-то сделать».
    Какая из ваших мыслей появляется чаще других?
    Есть ли общий сюжет? Например, опасность, неопределённость, потеря контроля, возможная ошибка, плохая оценка окружающих.
    Сейчас не нужно определять, насколько эти мысли правдивы. Мы продолжаем наблюдать.
    Следующая часть профиля — поведение.
    Что вы обычно делаете, когда тревога усиливается?
    Проверяете?
    Откладываете?
    Избегаете?
    Спрашиваете мнение других?
    Ищете информацию?
    Отменяете планы?
    Суетитесь и пытаетесь сделать всё сразу?
    Становитесь раздражительным?
    Закрываетесь и стараетесь ни с кем не говорить?
    Попробуйте выделить одну или две реакции, которые повторяются чаще.
    Теперь задайте себе важный вопрос: что происходит сразу после этого действия?
    Например, проверка может на несколько минут успокоить. Избегание может принести облегчение, потому что неприятная ситуация исчезла. Разговор с близким человеком может снизить напряжение. А иногда действие вообще не помогает и тревога продолжается.
    Нам пока не нужно оценивать эти способы. Важно понять, какие из них вы используете.
    Теперь соберите всё вместе.
    «Когда ______, у меня обычно появляется тревога. Я замечаю в теле ______. В голове возникает мысль ______. Мне хочется ______. Обычно я делаю ______. После этого я чувствую ______».
    Заполните эту схему так, как получается сейчас.
    Прочитайте её.
    Это похоже на вас?
    Возможно, у вас не один, а два разных тревожных сценария. Например, тревога о здоровье начинается с тела, а тревога на работе — с мыслей о возможной ошибке. Это нормально. Можно записать два варианта.
    Теперь посмотрим на то, что помогает.
    За эту неделю были моменты, когда тревога хотя бы немного снижалась или становилась более управляемой.
    Что происходило тогда?
    Возможно, помогало движение. Разговор. Переключение внимания. Понимание фактов. Выполнение конкретного действия. Само наблюдение за тревогой. Или ничего заметно не помогало.
    Не нужно придумывать работающий способ только потому, что он «должен» помогать.
    Если пока ничего не нашли, так и отметьте: «Пока не понимаю, что мне помогает».
    Это тоже важная часть профиля. Следующая неделя будет посвящена телу, и мы сможем проверить разные способы регулирования физиологического напряжения.
    Теперь сравните себя в начале недели и сейчас.
    Возможно, тревога не стала меньше. Это не является главным критерием первой недели.
    Вопрос другой: стала ли она хоть немного понятнее?
    Можете ли вы сейчас назвать хотя бы один свой триггер?
    Одно характерное телесное ощущение?
    Одну повторяющуюся тревожную мысль?
    Одно типичное действие?
    Если можете — у вас уже появилась первая карта тревожной реакции.
    Если пока не можете — не нужно заставлять себя. Вернитесь к одному конкретному эпизоду и снова пройдите последовательность: что произошло, что почувствовало тело, какая мысль появилась, что захотелось сделать.
    Ваш профиль будет уточняться постепенно.
    Сохраните итог этой практики в дневнике текстом или голосом. Не обязательно записывать всё. Можно оставить короткое описание своего основного сценария.
    Например: «Я чаще тревожусь, когда не понимаю, что будет дальше. Сначала напрягается живот и плечи. Потом появляется мысль, что ситуация закончится плохо. Я начинаю искать больше информации и проверять. На короткое время это успокаивает, но потом тревога возвращается».
    Это уже очень ценное наблюдение.
    В завершение ответьте себе на три вопроса.
    Как выглядит мой наиболее частый тревожный сценарий?
    Что в нём я теперь замечаю раньше, чем раньше?
    Что хотя бы немного помогает мне не потеряться внутри тревоги?
    На этом первая неделя наблюдения подходит к завершению. Вам не нужно уметь полностью управлять тревогой. На данном этапе достаточно, чтобы она стала чуть более понятной и узнаваемой.
    На следующем этапе мы будем работать с телом — той частью тревожной реакции, которая часто включается раньше, чем человек успевает всё осмыслить. А ваш личный профиль тревоги останется картой, к которой можно возвращаться и дополнять её новыми наблюдениями. Ваша тревога не обязана стать понятной полностью за одну неделю. Но теперь у вас может быть чуть больше ориентиров: что её запускает, как реагирует тело, какие мысли появляются и что вы обычно делаете дальше. Эта карта ещё будет дополняться. И чем лучше вы узнаёте собственные реакции, тем больше появляется возможностей выбирать, как с ними обходиться. На сегодня этого достаточно.
- week: 2
  slot: T1
  code: TEXT_ANX_W2_T1
  days: 1-2
  title: Карта тревоги в теле
  text: |
    Устройтесь так, чтобы вам было достаточно удобно. Не нужно принимать специальную позу и не нужно заранее пытаться расслабиться. Эта практика не требует от вас немедленно убрать тревогу. Сегодня задача другая: заметить, как тело сообщает о напряжении, и научиться отличать сам телесный сигнал от мысли о том, что этот сигнал обязательно означает опасность.
    Для начала почувствуйте, где вы сейчас находитесь. Посмотрите вокруг. Отметьте помещение, свет, предметы рядом. Почувствуйте поверхность под собой и опору под стопами. Спросите себя: «Есть ли прямо сейчас непосредственная опасность, на которую мне действительно нужно реагировать?» Если такой угрозы нет, просто отметьте: «Сейчас я здесь. Сейчас я могу наблюдать. В эту минуту я в безопасности».
    Не нужно убеждать себя силой. Достаточно проверить реальность.
    Теперь переведите внимание на тело. Спросите: «Что сейчас происходит в моём теле?» Не ищите правильного ответа. Возможно, вы заметите напряжение в плечах, сжатие в груди, тяжесть в животе, напряжённую челюсть, дрожь, жар, холод, учащённое дыхание или внутреннюю суету. Возможно, ничего яркого сейчас нет. Это тоже нормально.
    Начните с лица. Почувствуйте лоб, область вокруг глаз, челюсть. Не расслабляйте их специально. Просто отметьте: спокойно, напряжено или нейтрально.
    Переведите внимание к шее и плечам. Есть ли здесь тяжесть, давление, желание поднять плечи, зафиксировать их? Просто замечайте.
    Теперь грудь. Почувствуйте дыхание таким, какое оно есть. Не делайте вдох глубже. Не пытайтесь дышать «правильно». Есть ли в груди сжатие, давление, тепло, пустота, ощущение нехватки пространства? Назовите именно ощущение, а не его объяснение.
    Переведите внимание к животу. Затем к спине. К рукам, кистям, ногам и стопам.
    Попробуйте найти две зоны. Одну — где напряжение сейчас заметнее. Вторую — где относительно спокойно или хотя бы нейтрально. Спокойная зона не обязана быть полностью расслабленной. Нам достаточно места, которое ощущается немного устойчивее.
    Теперь на несколько секунд задержите внимание на напряжённой зоне. Опишите её простыми словами: «сжатие», «тяжесть», «жар», «дрожь», «комок», «давление». И обратите внимание на разницу: «Со мной что-то не так» — это уже мысль. «В груди сейчас есть сжатие» — наблюдение.
    Скажите про себя: «Я замечаю сигнал тревоги. Сигнал тревоги — ещё не доказательство опасности».
    Посмотрите вокруг ещё раз. Найдите глазами знакомый предмет. Почувствуйте опору под телом. Если вокруг действительно нет непосредственной угрозы, добавьте: «Моё тело насторожилось. Но прямо сейчас я могу оставаться здесь. В эту минуту я в безопасности».
    Теперь переведите внимание на более спокойную или нейтральную зону. Почувствуйте её несколько секунд. Затем ненадолго вернитесь к напряжённой. И снова — к нейтральной.
    Так вы постепенно учитесь замечать, что тревога не обязательно занимает всё тело целиком. Одна часть может быть напряжена, а другая сохранять устойчивость. И внимание может перемещаться между ними.
    Теперь вспомните один недавний, но не самый тяжёлый эпизод тревоги. Обычную ситуацию: сообщение, разговор, ожидание, мысль о будущем, необходимость что-то решить.
    Что произошло первым?
    Попробуйте восстановить последовательность без оценки. Ситуация. Первый телесный сигнал. Следующая реакция. Мысли. Ваши действия.
    Например: «Я подумал о завтрашнем разговоре — напряглись плечи — дыхание стало быстрее — появилась мысль, что всё пойдёт плохо — я начал прокручивать сценарий».
    У вас последовательность будет своей.
    Особенно важно найти самый ранний телесный сигнал. Тот момент, когда организм уже включил настороженность, но тревога ещё не успела полностью захватить внимание.
    Спросите себя: «Что моё тело обычно делает первым?» Напрягает плечи? Сжимает живот? Ускоряет дыхание? Заставляет стискивать челюсть? Создаёт тяжесть в груди?
    Это и есть начало вашей личной карты тревоги.
    Теперь представьте, что в следующий раз вы замечаете этот сигнал чуть раньше. Вам не нужно сразу его устранять. Вы можете остановиться на несколько секунд, почувствовать опору, посмотреть вокруг и проверить: «Что происходит на самом деле? Есть ли опасность сейчас — или моё тело готовится к возможной опасности?»
    Если непосредственной угрозы нет, скажите: «Спасибо, тело. Я вижу, что ты пытаешься меня защитить. Но сейчас мне не нужно действовать так, будто опасность уже произошла. Сейчас я в безопасности».
