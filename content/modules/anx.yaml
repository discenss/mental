    - Как я буду использовать свой протокол в обычной жизни дальше?
final_product:
  title: Мой личный анти-тревожный протокол
  sections:
  - '1. Как я понимаю, что тревога начинается

    Короткий список самых ранних и надёжных личных признаков — в теле, мыслях или
    поведении, — по которым вы узнаёте начало тревожной реакции раньше, чем она
    успевает набрать силу.

    '
  - '2. Что происходит в моём теле и какие мысли появляются

    Описание типичной телесной реакции и повторяющейся тревожной мысли, которые
    чаще всего сопровождают вашу тревогу.

    '
  - '3. Какая старая стратегия включается автоматически

    Название привычного автоматического поведения — избегание, бесконечная проверка,
    поиск гарантий или катастрофизация, — которое раньше включалось без вашего осознанного
    выбора.

    '
  - '4. Какие 2–3 инструмента действительно помогают мне

    Короткий практический список телесных и поведенческих способов саморегуляции,
    подтверждённых вашим собственным опытом за время программы.

    '
  - '5. Какой вопрос я задаю тревожной мысли

    Личный вопрос или короткая проверка, которая помогает отделить факт от тревожного
    прогноза и катастрофического сценария.

    '
  - '6. Какое действие выбираю вместо избегания, повторной проверки или поиска гарантии

    Конкретное новое действие, которое вы сознательно выбираете вместо привычной
    автоматической реакции на тревогу.

    '
  - '7. Какая фраза возвращает мне опору

    Личная короткая фраза или образ, который помогает почувствовать опору и устойчивость
    в момент тревоги.

    '
  - '8. Как я возвращаюсь к обычной жизни после тревожного эпизода

    Короткое описание того, как вы восстанавливаетесь и возвращаетесь к обычным
    делам после того, как острая тревога спадает, не застревая в прокручивании ситуации
    и не уходя в избегание.

    '
  - '9. SOS-карточка на момент сильной тревоги

    ЗАМЕЧАЮ — называю, что сейчас происходит тревога, и нахожу её самый ранний телесный
    или мысленный сигнал.


    СТАБИЛИЗИРУЮСЬ — использую один из своих рабочих телесных способов: дыхание,
    мышечное отпускание, заземление или движение.


    ПРОВЕРЯЮ — отделяю факт от тревожного прогноза и задаю себе вопрос про доказательства.


    ВЫБИРАЮ — выбираю одно конкретное действие вместо избегания, повторной проверки
    или поиска гарантии.


    ПРОДОЛЖАЮ — возвращаюсь к обычным делам, используя свою личную фразу опоры.

    '
